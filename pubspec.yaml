name: kisan_mitra
description: "KisanMitra - Kisan ke liye Smart App"
publish_to: 'none'
version: 1.0.5+6

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  go_router: ^14.0.0
  http: ^1.2.0
  shared_preferences: ^2.3.0
  google_fonts: ^6.2.0
  shimmer: ^3.0.0
  url_launcher: ^6.3.0
  intl: ^0.19.0
  flutter_animate: ^4.5.0
  geolocator: ^14.0.3
  webview_flutter: ^4.14.1
  google_mobile_ads: ^5.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/app_logo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/app_logo.png"
  web:
    generate: true
    image_path: "assets/images/app_logo.png"
    background_color: "#FFFFFF"
    theme_color: "#1B5E20"

flutter:
  uses-material-design: true
  assets:
    - assets/data/
    - assets/images/
